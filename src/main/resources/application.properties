spring.application.name=banking-management-system
server.port=8088

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/banking_db}
spring.datasource.username=${DB_USERNAME:banking_user}
spring.datasource.password=${DB_PASSWORD:banking_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${BANKING_JWT_SECRET}
app.jwt.expiration-ms=${BANKING_JWT_EXPIRATION_MS:86400000}

app.dev-admin.enabled=${DEV_ADMIN_ENABLED:false}
app.dev-admin.email=${DEV_ADMIN_EMAIL:admin@bank.local}
app.dev-admin.password=${DEV_ADMIN_PASSWORD:}